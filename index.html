const A32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";

function myCode(){

  let out="";for(let i=0;i<bodyLen(L.length);i++){out=A32[Number(n&31n)]+out;n>>=5n}
  return fp()+out+encName(S.name);

function decode(raw){
  let t=String(raw).trim();const m=t.match(/r=([^&\s]+)/i);if(m)t=m[1];
  t=t.toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");
  const L=layout(),bad={err:"That code doesn't look right. Check that you copied all of it."};
  if(t.length<5||[...t].some(ch=>!A32.includes(ch)))return bad;
  if(t.slice(0,4)!==fp())return{err:"This code is from a different checklist, or the checklist was changed after it was made. Ask them to send a fresh code."};
  const bl=4+bodyLen(L.length);if(t.length<bl)return bad;
  let n=0n;for(const ch of t.slice(4,bl))n=n*32n+BigInt(A32.indexOf(ch));
  if(n>=6n**BigInt(L.length))return bad;
  const v=[];for(let k=0;k<L.length;k++){v.push(Number(n%6n));n/=6n}
  return{L,v,name:decName(t.slice(bl))};
}

  const ln=(S.name||"").trim()||"You",tn=d.name||"Them";
  return (same?`<p class="err">Heads up: these answers are identical to yours. If you pasted your own code, send it to your partner and paste theirs instead.</p>`:"")+`<p class="verdict" style="margin:14px 0 0">${esc(ln)} &amp; ${esc(tn)}</p><div class="big" style="margin-top:4px">${pct}%</div><p class="verdict">${word}</p><p class="mp">Based on ${all.length} item${all.length===1?"":"s"} you both rated.</p>`
   +cats.filter(o=>o.pts.length).map(o=>{const q=Math.round(avg(o.pts)*100);return `<div class="pc"><div><span>${esc(o.c.name)}</span><span>${q}%</span></div><div class="bar"><i style="width:${q}%"></i></div></div>`}).join("")
   +`<div class="mh">Yes list</div>`+(yes.length?`<div class="chips">${yes.map(n=>`<span class="chip g">${esc(n)}</span>`).join("")}</div>`:`<p class="mp">Nothing you both rated 4 or 5 yet.</p>`)
   +`<div class="mh">Let's talk</div>`+(talk.length?`<div class="chips">${talk.map(([n,a,b])=>`<span class="chip t">${esc(n)}<small>${esc(ln)} ${a} · ${esc(tn)} ${b}</small></span>`).join("")}</div>`:`<p class="mp">No big differences. Nice!</p>`);
}
const mdl=$("mdl"),mb=$("mbody");
let CUR={code:"",link:""},PENDING="";
function openM(html,focusId){mb.innerHTML=html;mdl.hidden=false;const f=focusId&&$(focusId);(f||$("mcl")).focus()}
function closeM(){mdl.hidden=true;mb.innerHTML=""}
function openCode(submitted){
  const L=layout(),done=L.filter(([ci,ii,w])=>get(CONFIG.categories[ci].name,CONFIG.categories[ci].items[ii],w)).length,raw=myCode();
  CUR={code:fmt(raw),link:location.href.split("#")[0]+"#r="+raw};
  const intro=!done?"You haven't rated anything yet, so there is nothing to save or share. Rate some items first.":submitted?`Your ratings are saved on this device (${done} of ${L.length} answers). You can come back and change them any time. Send the code or link below to your partner so they can compare.`:"Send this code or link to your partner. They open it, rate their own checklist, and press Compare.";
  const tip=done&&!S.name.trim()?" Tip: type your name at the top first, so your partner sees it in the results.":"";
  openM(`<h3>${submitted&&done?"Submitted ✓":"Your code"}</h3><p class="mp">${esc(intro+tip)}</p><code class="cd">${esc(CUR.code)}</code><div class="brow"><button class="btn p" data-copy="code">Copy code</button><button class="btn" data-copy="link">Copy link</button></div><p class="mp" style="margin:14px 0 0">This code contains your answers. Only send it to someone you trust. Nothing is uploaded, and this site never sees it.</p>`);
}
function runCompare(){$("cres").innerHTML=compareHTML(decode($("cin").value))}
function openCompare(pre){
  openM(`<h3>Compare</h3><p class="mp">Paste your partner's code or link below. Your own current ratings are compared with theirs.</p><textarea class="ta" id="cin" placeholder="Paste their code or link here" spellcheck="false"></textarea><div class="brow"><button class="btn p" data-go="1">Compare</button></div><div id="cres"></div>`,"cin");
  if(pre){$("cin").value=pre;runCompare()}
}
function copyText(t,b){
  const done=()=>{const o=b.textContent;b.textContent="Copied!";setTimeout(()=>b.textContent=o,1500)};
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();
}
mb.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.copy)copyText(b.dataset.copy==="code"?CUR.code:CUR.link,b);
  if(b.dataset.go)runCompare();
  if(b.dataset.fin==="copy"){const t=$("fin");t.focus();t.select();copyText(FIN,b)}
});
$("mcl").onclick=closeM;
mdl.addEventListener("click",e=>{if(e.target===mdl)closeM()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!mdl.hidden)closeM()});
$("gcd").onclick=()=>openCode(false);
$("sbm").onclick=()=>openCode(true);
$("cmp").onclick=()=>openCompare(PENDING);
$("cnow").onclick=()=>openCompare(PENDING);
{const hm=location.hash.match(/r=([0-9A-Za-z-]+)/);if(hm){PENDING=hm[1];$("cnote").hidden=false;const pd=decode(PENDING);if(!pd.err&&pd.name)$("cnote").querySelector("span").textContent=pd.name+" shared their results with you. Rate the items you want, then compare."}}
/* ===== end compare ===== */

$("dl").onclick=()=>exportPNG(false);
$("dlr").onclick=()=>exportPNG(true);
renderHead();render();
if(!LOCKED&&$("dtx"))$("dtx").textContent=FOUND?"Your saved categories are loaded: "+CONFIG.categories.map(c=>c.name).join(", ")+".":"No saved categories were found here, so the default ones are showing.";
</script>
</body>
